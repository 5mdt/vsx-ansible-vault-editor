---
name: lint

on:
  push:
  pull_request:

jobs:
  markdownfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go install github.com/Kunde21/markdownfmt/v3/cmd/markdownfmt@v3.1.0
      - run: test -z "$(markdownfmt -l $(find . -name '*.md' -not -path './.git/*'))"

  yamlfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      - run: yamlfmt -lint .
