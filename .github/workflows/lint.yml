---
name: lint

on:
  push:
  pull_request:

jobs:
  markdownfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - run: go install github.com/Kunde21/markdownfmt/v3/cmd/markdownfmt@v3.1.0
      - run: test -z "$(markdownfmt -soft-wraps -l $(find . -name '*.md' -not -path './.git/*'))"

  yamlfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      - run: yamlfmt -lint .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pipx install ansible-core
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: AVE_REQUIRE_ANSIBLE=1 npm run test:integration
