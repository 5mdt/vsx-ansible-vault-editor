---
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pipx install ansible-core
      - name: Tag must match package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: AVE_REQUIRE_ANSIBLE=1 npm run test:integration
      - run: make package
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --no-dependencies --packagePath build/ansible-vault-editor.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx ovsx publish build/ansible-vault-editor.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
