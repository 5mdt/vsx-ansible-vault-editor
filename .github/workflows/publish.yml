---
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pipx install ansible-core
      - name: Tag must match package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: AVE_REQUIRE_ANSIBLE=1 npm run test:integration
      - run: make package
      - name: Attach the vsix to the GitHub release
        run: |
          # Notes are the tag's docs/CHANGELOG.md section; --generate-notes would list only merged PRs (Dependabot's), since work lands on main directly.
          awk -v t="## $GITHUB_REF_NAME " 'index($0, "## ") == 1 { on = (index($0, t) == 1); next } on' docs/CHANGELOG.md > build/release-notes.md
          [ -s build/release-notes.md ] || { echo "::error::no $GITHUB_REF_NAME section in docs/CHANGELOG.md"; exit 1; }
          gh release create "$GITHUB_REF_NAME" build/ansible-vault-editor.vsix --title "$GITHUB_REF_NAME" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath build/ansible-vault-editor.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish build/ansible-vault-editor.vsix
      - name: Report skipped registries
        run: |
          [ -n "$VSCE_PAT" ] || echo "::notice::VSCE_PAT is not set; skipped the Visual Studio Marketplace"
          [ -n "$OVSX_PAT" ] || echo "::notice::OVSX_PAT is not set; skipped Open VSX"
