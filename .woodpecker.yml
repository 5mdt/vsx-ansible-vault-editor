---
steps:
  - name: markdownfmt
    image: golang:1.23-alpine
    commands:
      - go install github.com/Kunde21/markdownfmt/v3/cmd/markdownfmt@v3.1.0
      - test -z "$(markdownfmt -l $(find . -name '*.md' -not -path './.git/*'))"

  - name: yamlfmt
    image: golang:1.23-alpine
    commands:
      - go install github.com/google/yamlfmt/cmd/yamlfmt@latest
      - yamlfmt -lint .
